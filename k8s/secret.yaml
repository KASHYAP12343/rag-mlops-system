apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: rag-system
  labels:
    app: rag-api
    project: rag-mlops
type: Opaque
# ──────────────────────────────────────────────────────────────────────────────
# IMPORTANT: Do NOT commit real secrets to Git.
# This file is managed by Ansible using ansible-vault encrypted variables.
# The Ansible kubernetes role renders this template with actual base64 values.
#
# To generate a base64-encoded value manually:
#   echo -n "your-actual-groq-key" | base64
#
# Ansible will inject the real value from vault.yml at deploy time.
# ─────────────────────s─────────────────────────────────────────────────────────
data:
  GROQ_API_KEY: "REPLACE_WITH_BASE64_ENCODED_KEY"