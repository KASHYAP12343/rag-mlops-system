---
# ansible/roles/rag_app/tasks/main.yml
# Application-level tasks: verify health and demonstrate re-indexing.
#
# The Jenkins container cannot reach the ClusterIP service directly.
# We use `kubectl exec` to run curl inside the pod — no port-forward needed.

- name: Wait for RAG API to be healthy (via kubectl exec inside pod)
  ansible.builtin.command: >
    {{ kubectl_bin }} exec -n {{ k8s_namespace }}
    deployment/rag-backend
    -- curl -sf http://localhost:8000/health
  register: health_check
  retries: 10
  delay: 15
  until: health_check.rc == 0
  changed_when: false

- name: Confirm API is healthy
  ansible.builtin.debug:
    msg: "✅ RAG API is healthy: {{ health_check.stdout }}"

- name: Check readiness probe (via kubectl exec)
  ansible.builtin.command: >
    {{ kubectl_bin }} exec -n {{ k8s_namespace }}
    deployment/rag-backend
    -- curl -sf http://localhost:8000/ready
  register: ready_check
  failed_when: false
  changed_when: false

- name: Show readiness status
  ansible.builtin.debug:
    msg: "Readiness: {{ ready_check.stdout }}"

- name: Check vector store stats (via kubectl exec)
  ansible.builtin.command: >
    {{ kubectl_bin }} exec -n {{ k8s_namespace }}
    deployment/rag-backend
    -- curl -sf http://localhost:8000/api/v1/stats
  register: stats_result
  failed_when: false
  changed_when: false

- name: Show collection stats
  ansible.builtin.debug:
    msg: "📊 Vector store: {{ stats_result.stdout | default('N/A') }}"
