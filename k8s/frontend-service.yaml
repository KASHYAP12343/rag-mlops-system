apiVersion: v1
kind: Service
metadata:
  name: rag-frontend-service
  namespace: rag-system
  labels:
    app: rag-frontend
    project: rag-mlops
spec:
  # NodePort makes the frontend accessible on the Minikube node IP
  type: NodePort
  selector:
    app: rag-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080    # access via: minikube ip → http://<MINIKUBE_IP>:30080
      protocol: TCP
