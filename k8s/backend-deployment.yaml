apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-backend
  namespace: rag-system
  labels:
    app: rag-api
    version: "1.0"
    project: rag-mlops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # allow 1 extra pod during update
      maxUnavailable: 0    # zero downtime — never kill before new pod is ready
  template:
    metadata:
      labels:
        app: rag-api
        version: "1.0"
    spec:
      containers:
        - name: rag-api
          image: mayank2101/rag-mlops:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          # ── Resource limits ───────────────────────────────────────────────
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          # ── Environment from ConfigMap ────────────────────────────────────
          envFrom:
            - configMapRef:
                name: rag-config
          # ── Sensitive env from Secret ─────────────────────────────────────
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: GROQ_API_KEY
          # ── Startup probe — gate liveness/readiness until app is ready ────
          # Allows up to 5 min (30 × 10s) for model loading before K8s
          # starts liveness/readiness checks. Prevents false-positive restarts.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30    # start checking after 30s
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30       # 30 × 10s = 5 min max startup window
          # ── Liveness probe — restart if API becomes unresponsive ──────────
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10    # startupProbe gates this; short delay is fine
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # ── Readiness probe — stop traffic if dependencies are down ───────
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10    # startupProbe gates this too
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4        # 4×15s = 60s grace after startup
          # ── Log volume ────────────────────────────────────────────────────
          volumeMounts:
            - name: log-volume
              mountPath: /app/logs
      volumes:
        - name: log-volume
          emptyDir: {}