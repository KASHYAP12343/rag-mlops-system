[SERVICE]
    Daemon    Off
    Flush     5
    Log_Level warn
    Parsers_File parsers.conf
    HTTP_Server On
    HTTP_Listen 0.0.0.0
    HTTP_Port   2020

# ── INPUT: tail the FastAPI JSON log file ────────────────────────────────────
[INPUT]
    Name              tail
    Tag               rag.api
    Path              /logs/app.log
    Parser            json
    DB                /var/log/flb_rag.db
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Refresh_Interval  10

# ── FILTER: add service metadata ─────────────────────────────────────────────
[FILTER]
    Name  record_modifier
    Match rag.*
    Record service   rag-api
    Record env       production

# ── OUTPUT: forward to Elasticsearch ─────────────────────────────────────────
[OUTPUT]
    Name            es
    Match           rag.*
    Host            elasticsearch
    Port            9200
    Index           rag-logs
    Suppress_Type_Name On
    Retry_Limit     5
    tls             Off
    tls.verify      Off
